<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        if (localStorage.getItem("name")) {
            a = localStorage.getItem("name")
            document.write("Welcome " + a)
        }
        else {
            let a = prompt("Enter your name: ")
            localStorage.setItem("name", a)

            // we can only store strings in local storage to convert a variable or an object to string JSON.stringify(a)

            //Ex: localStorage.setItem("guys", JSON.stringify(a))
            // JSON.parses(localStorage.getItem("guys"))
        }

    </script>
</body>

</html>
